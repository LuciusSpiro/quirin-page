upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300

; Windows-Docker-Bind-Mounts (WSL2) sind bei vielen kleinen Dateizugriffen sehr langsam.
; OPcache soll kompilierte Dateien im Speicher behalten statt bei jedem Request per stat()
; auf Aenderungen zu pruefen - das entfernt fast den gesamten I/O-Flaschenhals.
; Nachteil: Theme-/Plugin-Aenderungen erfordern "docker compose restart wordpress".
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
